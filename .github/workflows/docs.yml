name: Documentation checks
on: [push, pull_request]
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements-docs.txt pytest==8.3.5 playwright==1.51.0
      - run: python -m pytest tests/test_docs.py -q
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_docs.py
  guessing-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r examples/guessing-game/requirements.txt pytest==8.3.5 httpx==0.28.1
      - run: python -m pip check
      - run: python -m pytest examples/guessing-game/test_game.py -q
      - run: python examples/guessing-game/management.py typecheck
