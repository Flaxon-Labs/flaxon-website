<link rel="icon" type="image/svg+xml" href="/assets/images/logo/flaxon.png">

        <!-- Desktop Navigation -->

            <a href="/docs.html" class="text-slate-300 hover:text-white transition text-sm font-medium">Docs</a>

            <!-- Mobile Menu Button -->

                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-slate-900 dark:bg-slate-950 border-t border-slate-800">
        <div class="container mx-auto px-4 py-4 flex flex-col gap-3">
            <a href="/" class="text-slate-300 hover:text-white py-2 px-3 rounded-lg hover:bg-slate-800 transition">Home</a>
            <a href="/docs.html" class="text-slate-300 hover:text-white py-2 px-3 rounded-lg hover:bg-slate-800 transition">Docs</a>
            <a href="/examples.html" class="text-slate-300 hover:text-white py-2 px-3 rounded-lg hover:bg-slate-800 transition">Examples</a>
            <a href="/community.html" class="text-slate-300 hover:text-white py-2 px-3 rounded-lg hover:bg-slate-800 transition">Community</a>
            <a href="/blog.html" class="text-slate-300 hover:text-white py-2 px-3 rounded-lg hover:bg-slate-800 transition">Blog</a>
            <div class="border-t border-slate-800 pt-3 mt-1">
                <a href="/installation.html" class="block gradient-btn text-white font-medium text-center py-2.5 rounded-lg transition hover:shadow-lg hover:shadow-blue-500/25">
                    <i class="fas fa-rocket mr-1.5"></i> Get Started
                </a>
            </div>
        </div>
    </div>
</header>


<div id="breadcrumb-container" class="hidden bg-slate-800/50 dark:bg-slate-900/50 border-b border-slate-700/50 py-2 px-4">
    <div class="container mx-auto">
        <nav id="breadcrumb" class="text-sm text-slate-400" aria-label="Breadcrumb">
            <a href="/" class="hover:text-white transition">
                <i class="fas fa-home mr-1.5"></i> Home
            </a>
            <span class="text-slate-600 mx-2">/</span>
            <span id="breadcrumb-current" class="text-slate-300">Documentation</span>
        </nav>
    </div>
</div>


<div id="search-modal-container"></div>
<script>
    fetch('/components/search-modal.html')
        .then(r => r.text())
        .then(html => document.getElementById('search-modal-container').innerHTML = html);
</script>


<!-- ============================================================ -->
<!-- BREADCRUMB LOGIC                                             -->
<!-- ============================================================ -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const breadcrumbContainer = document.getElementById('breadcrumb-container');
        const breadcrumbCurrent = document.getElementById('breadcrumb-current');
        const currentPath = window.location.pathname;

        // Check if we're on a docs page
        const isDocsPage = currentPath === '/docs.html' || 
                          currentPath.startsWith('/docs/') ||
                          currentPath.startsWith('/docs/getting-started/') ||
                          currentPath.startsWith('/docs/core-concepts/') ||
                          currentPath.startsWith('/docs/guides/') ||
                          currentPath.startsWith('/docs/api/') ||
                          currentPath.startsWith('/docs/examples/');

        if (isDocsPage && breadcrumbContainer) {
            breadcrumbContainer.classList.remove('hidden');
            
            // Update breadcrumb text based on current page
            if (currentPath === '/docs.html' || currentPath === '/docs/') {
                breadcrumbCurrent.textContent = 'Documentation';
            } else if (currentPath.includes('/getting-started/')) {
                breadcrumbCurrent.textContent = 'Getting Started';
            } else if (currentPath.includes('/core-concepts/')) {
                breadcrumbCurrent.textContent = 'Core Concepts';
            } else if (currentPath.includes('/guides/')) {
                breadcrumbCurrent.textContent = 'Guides';
            } else if (currentPath.includes('/api/')) {
                breadcrumbCurrent.textContent = 'API Reference';
            } else if (currentPath.includes('/examples/')) {
                breadcrumbCurrent.textContent = 'Examples';
            } else {
                // Extract page name from URL
                const fileName = currentPath.split('/').pop() || 'Documentation';
                const pageName = fileName.replace('.html', '').replace(/-/g, ' ');
                breadcrumbCurrent.textContent = pageName.charAt(0).toUpperCase() + pageName.slice(1);
            }
        }
    });
</script>
