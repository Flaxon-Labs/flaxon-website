<dialog id="search-modal" aria-labelledby="search-title">
  <div class="search-panel">
    <div class="search-bar"><label id="search-title" for="search-input">Search documentation</label><button id="search-close" type="button" aria-label="Close search">×</button></div>
    <input id="search-input" type="search" placeholder="Search guides, APIs, lessons…" autocomplete="off">
    <div id="search-results-container" aria-live="polite"><p class="search-hint">Type at least two characters to search.</p></div>
    <p class="search-help">Tab to a result and press Enter to open it. Escape closes search.</p>
  </div>
</dialog>
