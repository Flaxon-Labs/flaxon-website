[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxon-labs-website"
version = "0.1.0"
description = "The Flaxon Labs organization website built with Flaxon"
requires-python = ">=3.11"
dependencies = ["flaxon[standard,security]==0.2.4", "asyncpg>=0.29", "aiosqlite>=0.20", "psycopg[binary]>=3.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
