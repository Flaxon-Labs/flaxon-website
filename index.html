<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="google-site-verification" content="l5zab0NHk3lbRe6HAabq8PNIt4BbzaHUr1Sao5YM5yc" />
    <title>Flaxon – Simple Python. Serious Applications.</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>

    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Highlight.js (light + dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        .gradient-hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 40%, #1e3a5f 70%, #0c4a6e 100%);
        }
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #2563eb, #06b6d4);
        }
        .gradient-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #0891b2);
        }
        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .glass-card-dark {
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .code-block {
            background: #0f172a;
            border-radius: 12px;
            padding: 1.25rem;
            overflow-x: auto;
            font-size: 0.85rem;
            border: 1px solid #1e293b;
        }
        .code-block code {
            color: #e2e8f0;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        .code-block .hljs {
            background: transparent !important;
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .animate-pulse-slow {
            animation: pulseSlow 3s ease-in-out infinite;
        }
        @keyframes pulseSlow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        .feature-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Three.js canvas */
        #solar-system {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Content overlay */
        .content-overlay {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        flaxon: {
                            blue: '#3776AB',
                            electric: '#00D4FF',
                            dark: '#0F172A',
                            light: '#F8FAFC',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>

    <!-- ============================================================ -->
    <!-- THREE.JS SOLAR SYSTEM                                          -->
    <!-- ============================================================ -->
    <div id="solar-system"></div>

    <!-- ============================================================ -->
    <!-- MAIN CONTENT OVERLAY                                          -->
    <!-- ============================================================ -->
    <div class="content-overlay">

        <!-- HEADER -->
        <div id="header" x-data="{}" x-init="fetch('/components/header.html').then(r=>r.text()).then(html=>$el.innerHTML=html)"></div>

        <!-- PARTIALS -->
        <div id="hero"></div>
        <div id="features"></div>
        <div id="stats"></div>
        <div id="testimonials"></div>
        <div id="cta"></div>
        <div id="newsletter"></div>

        <!-- FOOTER -->
        <div id="footer" x-data="{}" x-init="fetch('/components/footer.html').then(r=>r.text()).then(html=>$el.innerHTML=html)"></div>

    </div>

    <!-- ============================================================ -->
    <!-- SCRIPTS                                                       -->
    <!-- ============================================================ -->
    <script>
        // Load all partials
        document.addEventListener('DOMContentLoaded', function() {
            const partials = [
                { id: 'hero', path: '/partials/hero.html' },
                { id: 'features', path: '/partials/features.html' },
                { id: 'stats', path: '/partials/stats.html' },
                { id: 'testimonials', path: '/partials/testimonials.html' },
                { id: 'cta', path: '/partials/cta.html' },
                { id: 'newsletter', path: '/partials/newsletter.html' },
            ];

            partials.forEach(function(partial) {
                fetch(partial.path)
                    .then(r => r.text())
                    .then(html => document.getElementById(partial.id).innerHTML = html)
                    .catch(err => console.error('Failed to load partial:', partial.path, err));
            });

            // Init Highlight.js
            hljs.highlightAll();
        });

        // Dark mode toggle (persistent)
        if (localStorage.getItem('dark-mode') === 'true') {
            document.documentElement.classList.add('dark');
        }
    </script>

    <!-- ============================================================ -->
    <!-- THREE.JS SOLAR SYSTEM ANIMATION                               -->
    <!-- ============================================================ -->
    <script>
        (function() {
            const container = document.getElementById('solar-system');
            if (!container) return;

            // --- Scene setup ---
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05080f);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 18);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // --- Lights ---
            const ambientLight = new THREE.AmbientLight(0x222244, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.PointLight(0xffcc88, 1.2, 30);
            sunLight.position.set(0, 0, 0);
            scene.add(sunLight);

            const directionalLight = new THREE.DirectionalLight(0x4488ff, 0.3);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // --- Sun (Flaxon Core) ---
            const sunGeo = new THREE.SphereGeometry(1.0, 32, 32);
            const sunMat = new THREE.MeshStandardMaterial({
                color: 0xff8844,
                emissive: 0xff4400,
                emissiveIntensity: 0.6,
                metalness: 0.1,
                roughness: 0.3,
            });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sun);

            // Sun glow
            const glowGeo = new THREE.SphereGeometry(1.3, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xff8844,
                transparent: true,
                opacity: 0.12,
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            scene.add(glow);

            // Sun particles (corona)
            const coronaGeo = new THREE.BufferGeometry();
            const coronaCount = 600;
            const coronaPos = new Float32Array(coronaCount * 3);
            for (let i = 0; i < coronaCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 1.1 + Math.random() * 0.8;
                coronaPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                coronaPos[i * 3 + 1] = r * Math.cos(phi);
                coronaPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            }
            coronaGeo.setAttribute('position', new THREE.BufferAttribute(coronaPos, 3));
            const coronaMat = new THREE.PointsMaterial({
                color: 0xffaa55,
                size: 0.02,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
            });
            const corona = new THREE.Points(coronaGeo, coronaMat);
            scene.add(corona);

            // --- Orbiting Planets ---
            const planets = [];
            const planetData = [
                { radius: 2.2, size: 0.20, color: 0x88aaff, speed: 0.008, name: 'Mercury' },
                { radius: 3.0, size: 0.28, color: 0x66ccff, speed: 0.006, name: 'Venus' },
                { radius: 3.9, size: 0.32, color: 0x4488ff, speed: 0.005, name: 'Earth' },
                { radius: 5.0, size: 0.26, color: 0xff6633, speed: 0.004, name: 'Mars' },
                { radius: 6.5, size: 0.45, color: 0xcc8844, speed: 0.003, name: 'Jupiter' },
                { radius: 8.0, size: 0.38, color: 0xddcc88, speed: 0.0025, name: 'Saturn' },
                { radius: 9.5, size: 0.30, color: 0x88ccdd, speed: 0.002, name: 'Uranus' },
                { radius: 11.0, size: 0.28, color: 0x4488aa, speed: 0.0015, name: 'Neptune' },
            ];

            planetData.forEach((data, index) => {
                // Planet mesh
                const geo = new THREE.SphereGeometry(data.size, 16, 16);
                const mat = new THREE.MeshStandardMaterial({
                    color: data.color,
                    metalness: 0.2,
                    roughness: 0.6,
                    emissive: data.color,
                    emissiveIntensity: 0.05,
                });
                const mesh = new THREE.Mesh(geo, mat);

                // Random starting angle
                const startAngle = Math.random() * Math.PI * 2;
                mesh.position.x = data.radius * Math.cos(startAngle);
                mesh.position.z = data.radius * Math.sin(startAngle);

                scene.add(mesh);

                // Orbit ring
                const orbitGeo = new THREE.RingGeometry(data.radius - 0.02, data.radius + 0.02, 64);
                const orbitMat = new THREE.MeshBasicMaterial({
                    color: data.color,
                    transparent: true,
                    opacity: 0.06,
                    side: THREE.DoubleSide,
                });
                const orbit = new THREE.Mesh(orbitGeo, orbitMat);
                orbit.rotation.x = -Math.PI / 2;
                orbit.position.y = 0;
                scene.add(orbit);

                // Saturn rings
                if (data.name === 'Saturn') {
                    const ringGeo = new THREE.RingGeometry(0.4, 0.65, 32);
                    const ringMat = new THREE.MeshBasicMaterial({
                        color: 0xddcc88,
                        transparent: true,
                        opacity: 0.3,
                        side: THREE.DoubleSide,
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.rotation.x = Math.PI / 2.5;
                    ringMesh.rotation.z = 0.3;
                    mesh.add(ringMesh);
                }

                planets.push({
                    mesh: mesh,
                    radius: data.radius,
                    speed: data.speed,
                    angle: startAngle,
                    name: data.name,
                });
            });

            // --- Asteroid Belt (between Mars and Jupiter) ---
            const asteroidCount = 300;
            const astGeo = new THREE.BufferGeometry();
            const astPos = new Float32Array(asteroidCount * 3);
            const astSizes = new Float32Array(asteroidCount);
            for (let i = 0; i < asteroidCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const r = 5.6 + Math.random() * 0.8;
                const y = (Math.random() - 0.5) * 0.3;
                astPos[i * 3] = r * Math.cos(theta);
                astPos[i * 3 + 1] = y;
                astPos[i * 3 + 2] = r * Math.sin(theta);
                astSizes[i] = 0.02 + Math.random() * 0.04;
            }
            astGeo.setAttribute('position', new THREE.BufferAttribute(astPos, 3));
            astGeo.setAttribute('size', new THREE.BufferAttribute(astSizes, 1));
            const astMat = new THREE.PointsMaterial({
                color: 0x888888,
                size: 0.04,
                transparent: true,
                opacity: 0.5,
            });
            const asteroids = new THREE.Points(astGeo, astMat);
            scene.add(asteroids);

            // --- Stars (distant background) ---
            const starCount = 2000;
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(starCount * 3);
            const starColors = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 50 + Math.random() * 100;
                starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPos[i * 3 + 1] = Math.abs(r * Math.cos(phi));
                starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.15, 0.3, 0.5 + Math.random() * 0.5);
                starColors[i * 3] = c.r;
                starColors[i * 3 + 1] = c.g;
                starColors[i * 3 + 2] = c.b;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
            const starMat = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
            });
            const stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            // --- Mouse tracking for parallax ---
            let mouseX = 0;
            let mouseY = 0;
            let targetRotX = 0;
            let targetRotY = 0;

            document.addEventListener('mousemove', (event) => {
                const x = (event.clientX / window.innerWidth) * 2 - 1;
                const y = -(event.clientY / window.innerHeight) * 2 + 1;
                mouseX = x * 0.08;
                mouseY = y * 0.06;
            });

            // --- Resize ---
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // --- Animation Loop ---
            function animate() {
                requestAnimationFrame(animate);

                const time = Date.now() * 0.001;

                // Smooth mouse follow
                targetRotX += (mouseX * 0.3 - targetRotX) * 0.02;
                targetRotY += (mouseY * 0.3 - targetRotY) * 0.02;

                // Rotate sun
                sun.rotation.y += 0.002;
                glow.rotation.y += 0.001;
                corona.rotation.y += 0.001;

                // Pulse sun
                const pulse = 1 + Math.sin(time * 0.5) * 0.02;
                sun.scale.set(pulse, pulse, pulse);

                // Rotate planets
                planets.forEach((p) => {
                    p.angle += p.speed;
                    p.mesh.position.x = p.radius * Math.cos(p.angle);
                    p.mesh.position.z = p.radius * Math.sin(p.angle);
                    p.mesh.rotation.y += 0.01;
                });

                // Rotate asteroid belt
                asteroids.rotation.y += 0.001;

                // Rotate stars
                stars.rotation.y += 0.0001;

                // Parallax effect
                const group = scene;
                group.rotation.x = targetRotY * 0.03;
                group.rotation.y = targetRotX * 0.03;

                renderer.render(scene, camera);
            }

            animate();

            console.log('Flaxon Solar System animation loaded!');
        })();
    </script>

</body>
</html>
