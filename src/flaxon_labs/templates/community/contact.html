{% extends "base.html" %}{% block title %}{{ title }} | Flaxon Labs{% endblock %}{% block content %}<section class="article"><p class="eyebrow">CONTACT</p><h1>Start a conversation.</h1><p class="lead">Tell Flaxon Labs about a bug, contribution, partnership, or idea.</p>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}<form method="post" class="form"><label>Name<input name="name" required maxlength="160"></label><label>Email<input type="email" name="email" required maxlength="320"></label><label>Subject<input name="subject" required maxlength="240"></label><label>Message<textarea name="message" required maxlength="20000" rows="8"></textarea></label><button class="button" type="submit">Send message</button></form></section>{% endblock %}
