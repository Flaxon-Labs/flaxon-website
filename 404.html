<!-- 404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Page Not Found – Flaxon</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/flaxon.png">
    <link rel="apple-touch-icon" href="/assets/images/logo/flaxon.png">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        flaxon: { blue: '#3776AB', electric: '#00D4FF', dark: '#0F172A', light: '#F8FAFC' }
                    }
                }
            }
        }
    </script>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo/flaxon-logo.svg">
    <link rel="apple-touch-icon" href="/assets/images/logo/flaxon.png">
    <script defer src="/assets/js/site-shell.js"></script>
    <script defer src="/assets/js/dark-mode.js"></script>
    <script defer src="/assets/js/header-search.js"></script>
    <script defer src="/assets/js/main.js"></script></head>
<body>

    <div id="header"></div>

    <!-- 404 Page -->
    <section class="bg-slate-50 dark:bg-slate-950 py-32">
        <div class="container mx-auto px-4 text-center">
            <div class="max-w-md mx-auto">
                <div class="text-8xl font-extrabold text-flaxon-blue dark:text-flaxon-electric opacity-20">404</div>
                <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mt-4">Page Not Found</h1>
                <p class="text-slate-600 dark:text-slate-400 mt-2">The page you're looking for doesn't exist or has been moved.</p>

                <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="/" class="gradient-btn text-white font-medium px-6 py-3 rounded-xl inline-flex items-center justify-center">
                        <i class="fas fa-home mr-2"></i> Go Home
                    </a>
                    <a href="/docs.html" class="border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 px-6 py-3 rounded-xl font-medium transition inline-flex items-center justify-center">
                        <i class="fas fa-book mr-2"></i> Documentation
                    </a>
                </div>

                <div class="mt-8 p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800">
                    <p class="text-sm text-slate-500 dark:text-slate-400">Try searching the documentation:</p>
                    <div class="mt-2 flex">
                        <input type="text" placeholder="Search docs..." class="flex-1 px-4 py-2 border border-slate-300 dark:border-slate-700 rounded-l-xl bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-flaxon-blue">
                        <button class="gradient-btn text-white px-4 py-2 rounded-r-xl">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script>
        if (localStorage.getItem('dark-mode') === 'true') { document.documentElement.classList.add('dark'); }
    </script>

</body>
</html>
